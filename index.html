<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RCOS | 智能钢筋下料</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts/dist/echarts.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <script src="https://unpkg.com/feather-icons"></script>
    <style>
        /* 苹果系统级字体与抗锯齿渲染 */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: #F5F5F7; 
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            color: #1D1D1F;
        }
        
        /* 优雅的 macOS 风格滚动条 */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.15); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(0, 0, 0, 0.25); }

        /* 极柔和的阴影 */
        .apple-shadow { box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04); }
        
        /* 毛玻璃效果 */
        .glass-header {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        /* 输入框去边框化设计 */
        .apple-input {
            background-color: #F2F2F7;
            border: 2px solid transparent;
            transition: all 0.2s ease;
        }
        .apple-input:focus {
            background-color: #FFFFFF;
            border-color: #007AFF;
            box-shadow: 0 0 0 4px rgba(0, 122, 255, 0.1);
            outline: none;
        }

        .apple-btn:active { transform: scale(0.97); }
        
        /* 列表卡片激活态 */
        .list-card-active {
            border-color: #007AFF !important;
            background-color: #F0F7FF !important;
            box-shadow: 0 8px 24px rgba(0, 122, 255, 0.12) !important;
            transform: scale(1.01);
            z-index: 10;
        }

        .scroll-list-padding { padding-bottom: 24px; }
        
        /* Toast 动画样式 */
        .toast-enter { transform: translateY(-20px); opacity: 0; }
        .toast-active { transform: translateY(0); opacity: 1; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <header class="glass-header px-6 py-4 flex justify-between items-center shrink-0 z-20">
        <div class="flex items-center gap-3">
            <div class="bg-[#007AFF] p-1.5 rounded-lg text-white shadow-sm">
                <i data-feather="layers" class="w-5 h-5"></i>
            </div>
            <div>
                <h1 class="text-[17px] font-semibold tracking-tight text-[#1D1D1F]">RCOS 智能决策工作台</h1>
                <p class="text-[11px] font-medium text-[#86868B] tracking-wide uppercase mt-0.5">Multi-stock 1D-CSP Optimizer</p>
            </div>
        </div>
    </header>

    <main class="flex-grow flex overflow-hidden">
        
        <aside class="w-[400px] bg-[#F5F5F7] flex flex-col shrink-0 overflow-y-auto z-10 p-5 gap-5 border-r border-[rgba(0,0,0,0.05)]">
            
            <section class="bg-white rounded-[20px] p-5 apple-shadow">
                <h2 class="text-[15px] font-semibold text-[#1D1D1F] mb-4 flex items-center gap-2">
                    <i data-feather="settings" class="w-4 h-4 text-[#86868B]"></i> 工艺约束
                </h2>
                <div class="flex items-center justify-between">
                    <label class="text-[14px] text-[#515154]">锯片切缝损耗 Δ</label>
                    <div class="flex items-center gap-2">
                        <input id="kerf" type="number" min="0" value="5" class="apple-input w-20 text-center rounded-xl p-2 text-[15px] font-medium text-[#1D1D1F]">
                        <span class="text-[13px] text-[#86868B]">mm</span>
                    </div>
                </div>
            </section>


            <section class="bg-white rounded-[20px] p-5 apple-shadow">
                <h2 class="text-[15px] font-semibold text-[#1D1D1F] mb-4 flex items-center gap-2">
                    <i data-feather="cpu" class="w-4 h-4 text-[#FF9500]"></i> 算法选择
                </h2>
                <div class="grid grid-cols-2 gap-2">
                    <button id="algoExactBtn" onclick="setAlgorithmMode('exact')" class="rounded-xl border border-transparent bg-[#F2F2F7] px-3 py-3 text-left transition-all apple-btn hover:border-[#007AFF] hover:bg-[#F0F7FF]">
                        <div class="text-[14px] font-semibold text-[#1D1D1F]">精确算法</div>
                        <div class="mt-0.5 text-[12px] text-[#86868B]">适用于小批量</div>
                    </button>
                    <button id="algoGaBtn" onclick="setAlgorithmMode('ga')" class="rounded-xl border border-transparent bg-[#F2F2F7] px-3 py-3 text-left transition-all apple-btn hover:border-[#007AFF] hover:bg-[#F0F7FF]">
                        <div class="text-[14px] font-semibold text-[#1D1D1F]">遗传算法</div>
                        <div class="mt-0.5 text-[12px] text-[#86868B]">适用于大批量</div>
                    </button>
                </div>
                <p class="mt-3 text-[12px] leading-relaxed text-[#86868B]">
                    小规模订单建议使用精确算法以获得最优整数解；大规模订单建议使用遗传算法以提高计算效率。
                </p>
            </section>

            <section class="bg-white rounded-[20px] p-5 apple-shadow flex flex-col max-h-[300px]">
                <h2 class="text-[15px] font-semibold text-[#1D1D1F] mb-4 flex items-center gap-2">
                    <i data-feather="package" class="w-4 h-4 text-[#34C759]"></i> 仓库可用原材
                </h2>
                <div class="flex gap-2 mb-4">
                    <input id="newStockLen" type="number" min="1" placeholder="长度 (mm)" class="apple-input w-[40%] rounded-xl p-2.5 text-[14px]">
                    <input id="newStockInv" type="number" min="1" placeholder="库存量" class="apple-input w-[35%] rounded-xl p-2.5 text-[14px]">
                    <button onclick="addStock()" class="w-[25%] bg-[#34C759] text-white rounded-xl text-[14px] font-medium hover:bg-[#32B353] transition-colors apple-btn">录入</button>
                </div>
                <div class="flex-grow overflow-hidden flex flex-col">
                    <div class="text-[12px] font-medium text-[#86868B] grid grid-cols-3 pb-2 text-center border-b border-gray-100">
                        <div>规格(mm)</div><div>库存(根)</div><div>操作</div>
                    </div>
                    <div id="stockBody" class="overflow-y-auto text-[14px] pt-1"></div>
                </div>
            </section>

            <section class="bg-white rounded-[20px] p-5 apple-shadow flex-grow flex flex-col">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-[15px] font-semibold text-[#1D1D1F] flex items-center gap-2">
                        <i data-feather="list" class="w-4 h-4 text-[#007AFF]"></i> 目标需求定尺
                    </h2>
                    <label class="cursor-pointer text-[13px] text-[#007AFF] hover:text-[#005bb5] font-medium transition-colors">
                        导入 Excel
                        <input type="file" id="excelFile" class="hidden" accept=".xlsx, .xls, .csv" onchange="importExcel()">
                    </label>
                </div>
                <div class="flex gap-2 mb-4">
                    <input id="newLen" type="number" min="1" placeholder="规格 (mm)" class="apple-input w-[40%] rounded-xl p-2.5 text-[14px]">
                    <input id="newDem" type="number" min="1" placeholder="需求量" class="apple-input w-[35%] rounded-xl p-2.5 text-[14px]">
                    <button onclick="addRow()" class="w-[25%] bg-[#007AFF] text-white rounded-xl text-[14px] font-medium hover:bg-[#0062cc] transition-colors apple-btn">加单</button>
                </div>
                <div class="flex-grow overflow-hidden flex flex-col">
                    <div class="text-[12px] font-medium text-[#86868B] grid grid-cols-3 pb-2 text-center border-b border-gray-100">
                        <div>定尺(mm)</div><div>需求(根)</div><div>操作</div>
                    </div>
                    <div id="demandBody" class="overflow-y-auto text-[14px] pt-1 min-h-[100px]"></div>
                </div>
            </section>

            <button onclick="runOptimization()" class="w-full bg-[#1D1D1F] text-white py-4 rounded-[18px] font-semibold text-[16px] apple-shadow hover:bg-[#000000] transition-all apple-btn flex justify-center items-center gap-2 mt-auto shrink-0">
                <i data-feather="play" class="w-4 h-4 fill-current"></i> 启动智能排产
            </button>
        </aside>

        <section class="flex-grow p-8 overflow-hidden relative bg-[#F5F5F7]">
            
            <div id="emptyState" class="absolute inset-0 flex flex-col items-center justify-center text-[#86868B] transition-opacity duration-300 z-10">
                <div class="bg-white p-6 rounded-[28px] apple-shadow mb-4">
                    <i data-feather="cpu" class="w-12 h-12 text-[#007AFF] opacity-80"></i>
                </div>
                <h3 class="text-[17px] font-medium text-[#1D1D1F]">等待算法引擎演算</h3>
                <p class="text-[14px] mt-1">请在左侧配置参数并点击启动</p>
            </div>

            <div id="resultPanel" class="hidden flex flex-col h-full gap-6 max-w-[1600px] mx-auto opacity-0 transition-opacity duration-500">
                
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 shrink-0">
                    <div class="bg-white p-6 rounded-[24px] apple-shadow relative overflow-hidden">
                        <div class="absolute top-0 right-0 p-6 opacity-5"><i data-feather="layers" class="w-20 h-20 text-[#007AFF]"></i></div>
                        <p class="text-[14px] font-medium text-[#86868B] mb-2">实际消耗原材(根)</p>
                        <h3 class="text-[40px] font-bold text-[#1D1D1F] leading-none" id="resUsed">0 <span class="text-[16px] font-medium text-[#86868B]">根</span></h3>
                    </div>
                    <div class="bg-white p-6 rounded-[24px] apple-shadow relative overflow-hidden">
                        <div class="absolute top-0 right-0 p-6 opacity-5"><i data-feather="scissors" class="w-20 h-20 text-[#FF3B30]"></i></div>
                        <p class="text-[14px] font-medium text-[#86868B] mb-2">产生废料总计(mm)</p>
                        <h3 class="text-[40px] font-bold text-[#FF3B30] leading-none" id="resWaste">0 <span class="text-[16px] font-medium text-[#FF8682]">mm</span></h3>
                    </div>
                    <div class="bg-white p-6 rounded-[24px] apple-shadow relative overflow-hidden">
                        <div class="absolute top-0 right-0 p-6 opacity-5"><i data-feather="pie-chart" class="w-20 h-20 text-[#34C759]"></i></div>
                        <p class="text-[14px] font-medium text-[#86868B] mb-2">材料综合利用率</p>
                        <h3 class="text-[40px] font-bold text-[#34C759] leading-none" id="resRate">0.00 <span class="text-[20px] font-medium text-[#8EE0A1]">%</span></h3>
                    </div>
                </div>

                <div class="grid grid-cols-1 xl:grid-cols-5 gap-6 flex-grow overflow-hidden pb-4">
                    
                    <div class="xl:col-span-2 bg-white rounded-[28px] apple-shadow flex flex-col overflow-hidden relative">
                        <div class="p-6 pb-4 border-b border-[#F2F2F7] shrink-0 bg-white/95 backdrop-blur z-20 shadow-sm flex justify-between items-center">
                            <h3 class="text-[17px] font-semibold text-[#1D1D1F] flex items-center gap-2">
                                <div class="w-1.5 h-5 bg-[#007AFF] rounded-full"></div> 方案执行明细
                            </h3>
                            <!-- 修复点 3：新增 Excel 导出按钮 -->
                            <button onclick="exportResultExcel()" class="bg-[#007AFF] text-white px-4 py-2 rounded-lg text-[13px] font-medium hover:bg-[#0062cc] transition-colors apple-btn flex items-center gap-1.5">
                                <i data-feather="download" class="w-3.5 h-3.5"></i> 导出Excel
                            </button>
                        </div>
                        <div id="aiAnalysis" class="flex-grow overflow-y-auto p-5 space-y-4 bg-[#F9F9FB] scroll-list-padding">
                        </div>
                    </div>

                    <!-- 修复点 1：为外层容器增加 relative 和底部内边距，容纳绝对定位的图例 -->
                    <div class="xl:col-span-3 bg-white flex flex-col rounded-[28px] apple-shadow overflow-hidden relative pb-[40px]">
                        <div class="p-6 pb-4 border-b border-[#F2F2F7] shrink-0 z-20 shadow-sm flex justify-between items-center">
                            <h3 class="text-[17px] font-semibold text-[#1D1D1F] flex items-center gap-2">
                                <div class="w-1.5 h-5 bg-[#5E5CE6] rounded-full"></div> 全局排样映射图
                            </h3>
                            <span class="text-[12px] font-medium text-[#86868B] bg-[#F2F2F7] px-2.5 py-1 rounded-lg">展示所有切割配方</span>
                        </div>
                        
                        <div id="chartScrollContainer" class="flex-grow overflow-y-auto relative bg-[#FCFCFC] p-4">
                            <div id="ganttChart" class="w-full"></div>
                        </div>
                        <!-- 修复点 1：固定在底部的图例容器 -->
                        <div id="fixedLegendContainer" class="absolute bottom-0 left-0 w-full h-[40px] bg-white/90 backdrop-blur border-t border-[#F2F2F7] flex justify-center items-center z-10 pointer-events-none">
                            <div id="ganttLegend" class="w-full h-full pointer-events-auto"></div>
                        </div>
                    </div>

                </div>
            </div>
        </section>
    </main>

    <div id="toastContainer" class="fixed top-4 inset-x-0 z-50 flex flex-col items-center pointer-events-none gap-2"></div>

    
    <script>
        feather.replace();

        let myChart = null;
        let legendChart = null;

        let stocks = [{ len: 12000, inv: 200 }];
        let demands = [
            { len: 5800, dem: 45 }, { len: 4200, dem: 60 }, { len: 3500, dem: 80 },
            { len: 2800, dem: 55 }, { len: 2100, dem: 110 }, { len: 1500, dem: 140 }
        ];
        let currentSolution = null;
        let selectedAlgorithm = 'ga';

        renderStocks();
        renderTable();
        setAlgorithmMode('ga');

        function setAlgorithmMode(mode) {
            selectedAlgorithm = mode;
            const exactBtn = document.getElementById('algoExactBtn');
            const gaBtn = document.getElementById('algoGaBtn');
            if (!exactBtn || !gaBtn) return;

            // 弃用原来会导致全黑的代码，改用高亮蓝底蓝边框，解决黑底黑字看不见的问题
            const activeCls = 'rounded-xl border px-3 py-3 text-left transition-all apple-btn border-[#007AFF] bg-[#F0F7FF] shadow-sm';
            const inactiveCls = 'rounded-xl border px-3 py-3 text-left transition-all apple-btn border-transparent bg-[#F2F2F7] hover:border-[#007AFF] hover:bg-[#F0F7FF]';

            if (mode === 'exact') {
                exactBtn.className = activeCls;
                gaBtn.className = inactiveCls;
                
                // 使用内联样式确保颜色强制生效，无需依赖 Tailwind CDN 运行时编译
                exactBtn.querySelector('.text-[14px]').style.color = '#007AFF';
                exactBtn.querySelector('.text-[12px]').style.color = '#007AFF';
                exactBtn.querySelector('.text-[12px]').style.opacity = '0.8';

                gaBtn.querySelector('.text-[14px]').style.color = '#1D1D1F';
                gaBtn.querySelector('.text-[12px]').style.color = '#86868B';
                gaBtn.querySelector('.text-[12px]').style.opacity = '1';
            } else {
                gaBtn.className = activeCls;
                exactBtn.className = inactiveCls;
                
                gaBtn.querySelector('.text-[14px]').style.color = '#007AFF';
                gaBtn.querySelector('.text-[12px]').style.color = '#007AFF';
                gaBtn.querySelector('.text-[12px]').style.opacity = '0.8';

                exactBtn.querySelector('.text-[14px]').style.color = '#1D1D1F';
                exactBtn.querySelector('.text-[12px]').style.color = '#86868B';
                exactBtn.querySelector('.text-[12px]').style.opacity = '1';
            }
        }

        function showToast(message, type = 'warning') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');

            const colorClass = type === 'error' || type === 'warning' ? 'text-[#FF3B30]' : 'text-[#007AFF]';
            const iconName = type === 'error' || type === 'warning' ? 'alert-circle' : 'info';

            toast.className = `flex items-center gap-2 bg-white/90 backdrop-blur-xl px-5 py-3 rounded-full shadow-[0_12px_40px_rgba(0,0,0,0.12)] border border-[rgba(0,0,0,0.05)] text-[14px] font-medium text-[#1D1D1F] transition-all duration-400 ease-[cubic-bezier(0.16,1,0.3,1)] toast-enter`;
            toast.innerHTML = `<i data-feather="${iconName}" class="w-5 h-5 ${colorClass}"></i> <span>${message}</span>`;

            container.appendChild(toast);
            feather.replace();

            requestAnimationFrame(() => {
                toast.classList.remove('toast-enter');
                toast.classList.add('toast-active');
            });

            setTimeout(() => {
                toast.classList.remove('toast-active');
                toast.classList.add('toast-enter');
                setTimeout(() => toast.remove(), 400);
            }, 3000);
        }

        function renderStocks() {
            let html = '';
            stocks.forEach((item, i) => html += `
                <div class="grid grid-cols-3 py-2.5 text-center border-b border-gray-50 hover:bg-[#F9F9FB] rounded-lg transition-colors group">
                    <div class="font-semibold text-[#34C759]">${item.len}</div>
                    <div class="text-[#1D1D1F]">${item.inv}</div>
                    <div>
                        <button onclick="stocks.splice(${i},1);renderStocks()" class="text-[#86868B] hover:text-[#FF3B30] opacity-0 group-hover:opacity-100 transition-all">
                            <i data-feather="minus-circle" class="w-4 h-4 mx-auto"></i>
                        </button>
                    </div>
                </div>`);
            document.getElementById('stockBody').innerHTML = html;
            feather.replace();
        }

        function addStock() {
            let l = Number(document.getElementById('newStockLen').value);
            let i = Number(document.getElementById('newStockInv').value);

            if (!l || !i || l <= 0 || i <= 0 || !Number.isInteger(l) || !Number.isInteger(i)) {
                return showToast('请输入大于 0 的有效整数', 'warning');
            }

            stocks.push({ len: l, inv: i });
            renderStocks();
            document.getElementById('newStockLen').value = '';
            document.getElementById('newStockInv').value = '';
            showToast('录入成功', 'info');
        }

        function renderTable() {
            let html = '';
            demands.forEach((item, i) => html += `
                <div class="grid grid-cols-3 py-2.5 text-center border-b border-gray-50 hover:bg-[#F9F9FB] rounded-lg transition-colors group">
                    <div class="font-medium text-[#007AFF]">${item.len}</div>
                    <div class="text-[#1D1D1F]">${item.dem}</div>
                    <div>
                        <button onclick="demands.splice(${i},1);renderTable()" class="text-[#86868B] hover:text-[#FF3B30] opacity-0 group-hover:opacity-100 transition-all">
                            <i data-feather="minus-circle" class="w-4 h-4 mx-auto"></i>
                        </button>
                    </div>
                </div>`);
            document.getElementById('demandBody').innerHTML = html;
            feather.replace();
        }

        function addRow() {
            let l = Number(document.getElementById('newLen').value);
            let d = Number(document.getElementById('newDem').value);

            if (!l || !d || l <= 0 || d <= 0 || !Number.isInteger(l) || !Number.isInteger(d)) {
                return showToast('请输入大于 0 的有效整数', 'warning');
            }

            demands.unshift({ len: l, dem: d });
            renderTable();
            document.getElementById('newLen').value = '';
            document.getElementById('newDem').value = '';
            showToast('加单成功', 'info');
        }

        function importExcel() {
            const fileInput = document.getElementById('excelFile');
            const file = fileInput.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const json = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

                    if (!json || json.length < 2) {
                        showToast('Excel解析失败，请检查格式', 'error');
                        return;
                    }

                    let headers = json[0].map(h => String(h).trim());
                    let lenIdx = headers.findIndex(h => h.includes('定尺') || h.includes('length') || h.includes('规格'));
                    let demIdx = headers.findIndex(h => h.includes('需求') || h.includes('demand') || h.includes('数量'));

                    if (lenIdx === -1 || demIdx === -1) {
                        showToast('Excel解析失败，请检查格式', 'error');
                        return;
                    }

                    let addedCount = 0;
                    for (let i = 1; i < json.length; i++) {
                        let row = json[i];
                        if (!row || row[lenIdx] === undefined || row[demIdx] === undefined) continue;

                        let l = Number(row[lenIdx]);
                        let d = Number(row[demIdx]);

                        if (l > 0 && d > 0 && Number.isInteger(l) && Number.isInteger(d)) {
                            demands.push({ len: l, dem: d });
                            addedCount++;
                        }
                    }

                    if (addedCount > 0) {
                        renderTable();
                        showToast(`Excel导入成功，新增${addedCount}条数据`, 'info');
                    } else {
                        showToast('Excel解析失败，请检查格式', 'error');
                    }

                } catch (err) {
                    showToast('Excel解析失败，请检查格式', 'error');
                } finally {
                    fileInput.value = '';
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function exportResultExcel() {
            if (!currentSolution || !currentSolution.patterns || currentSolution.patterns.length === 0) {
                showToast('暂无方案数据可导出', 'warning');
                return;
            }

            const ws_data = [["模式", "原材(mm)", "配方"]];

            currentSolution.patterns.forEach((p, idx) => {
                let modeStr = `P${idx + 1}`;
                let rawLen = p.stockLen;

                let comboStrParts = [];
                p.items.forEach(item => {
                    comboStrParts.push(`${item.len}mm × ${item.count}`);
                });
                let formulaStr = comboStrParts.join(' + ');

                ws_data.push([modeStr, rawLen, formulaStr]);
            });

            const ws = XLSX.utils.aoa_to_sheet(ws_data);
            ws['!cols'] = [{ wch: 10 }, { wch: 15 }, { wch: 50 }];

            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "方案明细");

            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const timestamp = `${year}${month}${day}${hours}${minutes}${seconds}`;

            const filename = `钢筋下料方案_${timestamp}.xlsx`;
            XLSX.writeFile(wb, filename);
            showToast('方案已导出为Excel', 'info');
        }

        function getAlgoLabel() {
            return selectedAlgorithm === 'exact' ? '精确算法' : '遗传算法';
        }

        function expandDemands(reqs) {
            const items = [];
            reqs.forEach((r, ridx) => {
                for (let i = 0; i < r.dem; i++) {
                    items.push({ id: `${ridx}_${i}_${r.len}`, len: Number(r.len) });
                }
            });
            return items;
        }

        function cloneStocks(list) {
            return list.map(s => ({ len: Number(s.len), inv: Number(s.inv) }));
        }

        function cloneBins(bins) {
            return bins.map(b => ({
                stockLen: b.stockLen,
                residual: b.residual,
                items: b.items.map(x => Number(x))
            }));
        }

        function aggregateBinsToSolution(bins, kerf) {
            let patternMap = new Map();
            let totalWaste = 0;
            let totalUsed = 0;

            bins.forEach(bin => {
                const counts = {};
                bin.items.forEach(l => counts[l] = (counts[l] || 0) + 1);
                const sortedLens = Object.keys(counts).map(Number).sort((a, b) => b - a);
                const keyStr = `${bin.stockLen}_${sortedLens.map(l => `${l}x${counts[l]}`).join('_')}`;
                const usedLen = bin.items.reduce((s, v) => s + v, 0) + Math.max(0, bin.items.length - 1) * kerf;
                const waste = bin.stockLen - usedLen;
                totalWaste += waste;
                totalUsed += bin.stockLen;

                if (!patternMap.has(keyStr)) {
                    patternMap.set(keyStr, {
                        stockLen: bin.stockLen,
                        comboStr: sortedLens.map(l => `${l}mm × ${counts[l]}`).join(' + '),
                        items: sortedLens.map(l => ({ len: parseInt(l), count: counts[l] })),
                        waste: waste,
                        freq: 0,
                        usedLen: usedLen
                    });
                }
                patternMap.get(keyStr).freq += 1;
            });

            const patterns = Array.from(patternMap.values()).sort((a, b) => b.freq - a.freq);
            const totalTarget = demands.reduce((sum, d) => sum + d.len * d.dem, 0);
            const utilization = totalUsed > 0 ? (totalTarget / totalUsed) * 100 : 0;

            return {
                totalBins: bins.length,
                totalWaste,
                totalTarget,
                totalUsed,
                utilization,
                patterns
            };
        }

        function placeItemGreedyOnBins(orderCatIds, itemMap, reqCategories, stockSource, kerf) {
            const stockState = cloneStocks(stockSource).sort((a, b) => a.len - b.len);
            const bins = [];

            const categoryMap = new Map();
            reqCategories.forEach(c => categoryMap.set(c.id, c));

            for (const catId of orderCatIds) {
                const cat = categoryMap.get(catId);
                for (let t = 0; t < cat.dem; t++) {
                    const itemLen = cat.len;
                    let bestBinIdx = -1;
                    let bestWaste = Infinity;

                    for (let i = 0; i < bins.length; i++) {
                        const bin = bins[i];
                        const need = itemLen + kerf;
                        if (bin.residual >= need) {
                            const waste = bin.residual - need;
                            if (waste < bestWaste) {
                                bestWaste = waste;
                                bestBinIdx = i;
                            }
                        }
                    }

                    if (bestBinIdx !== -1) {
                        const bin = bins[bestBinIdx];
                        bin.items.push(itemLen);
                        bin.residual -= (itemLen + kerf);
                    } else {
                        let bestStockIdx = -1;
                        let minWaste = Infinity;
                        for (let i = 0; i < stockState.length; i++) {
                            if (stockState[i].inv > 0 && stockState[i].len >= itemLen) {
                                const waste = stockState[i].len - itemLen;
                                if (waste < minWaste) {
                                    minWaste = waste;
                                    bestStockIdx = i;
                                }
                            }
                        }
                        if (bestStockIdx === -1) return null;

                        const stock = stockState[bestStockIdx];
                        bins.push({
                            stockLen: stock.len,
                            residual: stock.len - itemLen,
                            items: [itemLen]
                        });
                        stock.inv -= 1;
                    }
                }
            }

            return bins;
        }

        function greedyPermutationDecode(order, reqCategories, stockSource, kerf) {
            const stockState = cloneStocks(stockSource).sort((a, b) => a.len - b.len);
            const bins = [];
            const categoryMap = new Map(reqCategories.map(c => [c.id, c]));

            for (const catId of order) {
                const cat = categoryMap.get(catId);
                if (!cat) continue;

                for (let k = 0; k < cat.dem; k++) {
                    const itemLen = cat.len;
                    let bestBinIdx = -1;
                    let minWaste = Infinity;

                    for (let i = 0; i < bins.length; i++) {
                        const bin = bins[i];
                        const need = itemLen + kerf;
                        if (bin.items.length > 0 && bin.residual >= need) {
                            const waste = bin.residual - need;
                            if (waste < minWaste) {
                                minWaste = waste;
                                bestBinIdx = i;
                            }
                        }
                    }

                    if (bestBinIdx !== -1) {
                        const bin = bins[bestBinIdx];
                        bin.items.push(itemLen);
                        bin.residual -= (itemLen + kerf);
                        continue;
                    }

                    let bestStockIdx = -1;
                    let bestStockWaste = Infinity;
                    for (let i = 0; i < stockState.length; i++) {
                        if (stockState[i].inv > 0 && stockState[i].len >= itemLen) {
                            const waste = stockState[i].len - itemLen;
                            if (waste < bestStockWaste) {
                                bestStockWaste = waste;
                                bestStockIdx = i;
                            }
                        }
                    }
                    if (bestStockIdx === -1) return null;

                    const stock = stockState[bestStockIdx];
                    bins.push({
                        stockLen: stock.len,
                        residual: stock.len - itemLen,
                        items: [itemLen]
                    });
                    stock.inv -= 1;
                }
            }

            return bins;
        }

        function solveWithGA(stocksData, reqs, kerf) {
            const categories = reqs.map((r, idx) => ({
                id: `c${idx}`,
                len: Number(r.len),
                dem: Number(r.dem)
            })).filter(c => c.dem > 0 && c.len > 0);

            if (categories.length === 0) return null;

            const categoryIds = categories.map(c => c.id);
            const populationSize = Math.max(24, Math.min(60, categories.length * 8));
            const generations = Math.max(50, Math.min(140, 20 + categories.length * 10));
            const eliteCount = 2;
            const crossoverRate = 0.85;
            const mutationRate = 0.18;

            function shuffle(arr) {
                const a = arr.slice();
                for (let i = a.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [a[i], a[j]] = [a[j], a[i]];
                }
                return a;
            }

            function evaluate(order) {
                const bins = greedyPermutationDecode(order, categories, stocksData, kerf);
                if (!bins) {
                    return { score: Number.POSITIVE_INFINITY, ok: false, bins: null, patterns: [] };
                }
                const summary = aggregateBinsToSolution(bins, kerf);
                const score = summary.totalWaste + bins.length * 0.001;
                return {
                    score,
                    ok: true,
                    bins,
                    ...summary
                };
            }

            function tournament(pop) {
                const k = 3;
                let best = null;
                for (let i = 0; i < k; i++) {
                    const cand = pop[Math.floor(Math.random() * pop.length)];
                    if (!best || cand.score < best.score) best = cand;
                }
                return best;
            }

            function orderCrossover(p1, p2) {
                const n = p1.length;
                if (n <= 1) return p1.slice();
                let a = Math.floor(Math.random() * n);
                let b = Math.floor(Math.random() * n);
                if (a > b) [a, b] = [b, a];

                const child = Array(n).fill(null);
                const used = new Set();

                for (let i = a; i <= b; i++) {
                    child[i] = p1[i];
                    used.add(p1[i]);
                }
                let pos = (b + 1) % n;
                for (let i = 0; i < n; i++) {
                    const gene = p2[(b + 1 + i) % n];
                    if (!used.has(gene)) {
                        child[pos] = gene;
                        used.add(gene);
                        pos = (pos + 1) % n;
                    }
                }
                return child;
            }

            function mutate(order) {
                const out = order.slice();
                if (out.length <= 1) return out;
                const i = Math.floor(Math.random() * out.length);
                const j = Math.floor(Math.random() * out.length);
                [out[i], out[j]] = [out[j], out[i]];
                if (out.length > 3 && Math.random() < 0.35) {
                    let a = Math.floor(Math.random() * out.length);
                    let b = Math.floor(Math.random() * out.length);
                    if (a > b) [a, b] = [b, a];
                    const seg = out.slice(a, b + 1).reverse();
                    out.splice(a, seg.length, ...seg);
                }
                return out;
            }

            let population = [];
            population.push(categoryIds.slice().sort((a, b) => {
                const ca = categories.find(x => x.id === a);
                const cb = categories.find(x => x.id === b);
                return cb.len - ca.len;
            }));
            while (population.length < populationSize) {
                population.push(shuffle(categoryIds));
            }

            let evaluated = population.map(order => ({ order, ...evaluate(order) })).sort((a, b) => a.score - b.score);
            let globalBest = evaluated[0];

            for (let gen = 0; gen < generations; gen++) {
                evaluated.sort((a, b) => a.score - b.score);
                if (evaluated[0].score < globalBest.score) globalBest = evaluated[0];

                const nextPop = evaluated.slice(0, eliteCount).map(x => x.order.slice());

                while (nextPop.length < populationSize) {
                    const parent1 = tournament(evaluated).order;
                    let child = parent1.slice();

                    if (Math.random() < crossoverRate) {
                        const parent2 = tournament(evaluated).order;
                        child = orderCrossover(parent1, parent2);
                    }
                    if (Math.random() < mutationRate) {
                        child = mutate(child);
                    }
                    nextPop.push(child);
                }

                evaluated = nextPop.map(order => ({ order, ...evaluate(order) }));
            }

            const bestEval = globalBest.ok ? globalBest : evaluated.sort((a, b) => a.score - b.score)[0];
            if (!bestEval || !bestEval.ok) return null;

            const finalSummary = aggregateBinsToSolution(bestEval.bins, kerf);
            return {
                ...finalSummary,
                algorithmName: '遗传算法',
                rawOrder: bestEval.order
            };
        }

        function solveWithExact(stocksData, reqs, kerf) {
            const items = expandDemands(reqs).sort((a, b) => b.len - a.len);
            if (items.length === 0) return null;

            const stockState = cloneStocks(stocksData).sort((a, b) => a.len - b.len);
            const suffixLen = new Array(items.length + 1).fill(0);
            for (let i = items.length - 1; i >= 0; i--) suffixLen[i] = suffixLen[i + 1] + items[i].len;

            let bestWaste = Number.POSITIVE_INFINITY;
            let bestBins = null;
            const seen = new Map();
            const timeLimitMs = 8000;
            const start = performance.now();

            function canonicalKey(idx, bins, stocks) {
                const residuals = bins.map(b => b.residual).sort((a, b) => a - b).join(',');
                const invKey = stocks.map(s => `${s.len}:${s.inv}`).join('|');
                return `${idx}#${invKey}#${residuals}`;
            }

            function currentWaste(bins) {
                return bins.reduce((sum, b) => sum + b.residual, 0);
            }

            function dfs(idx, bins, stocks) {
                if (performance.now() - start > timeLimitMs) {
                    throw new Error('EXACT_TIMEOUT');
                }

                if (idx === items.length) {
                    const waste = currentWaste(bins);
                    if (waste < bestWaste) {
                        bestWaste = waste;
                        bestBins = cloneBins(bins);
                    }
                    return;
                }

                const cw = currentWaste(bins);
                const lb = Math.max(0, cw - suffixLen[idx]);
                if (lb >= bestWaste) return;

                const key = canonicalKey(idx, bins, stocks);
                const prev = seen.get(key);
                if (prev !== undefined && prev <= cw) return;
                seen.set(key, cw);

                const itemLen = items[idx].len;
                const options = [];

                for (let i = 0; i < bins.length; i++) {
                    const bin = bins[i];
                    const need = itemLen + kerf;
                    if (bin.residual >= need) {
                        options.push({ type: 'bin', idx: i, score: bin.residual - need });
                    }
                }

                for (let s = 0; s < stocks.length; s++) {
                    if (stocks[s].inv > 0 && stocks[s].len >= itemLen) {
                        options.push({ type: 'new', idx: s, score: stocks[s].len - itemLen });
                    }
                }

                options.sort((a, b) => a.score - b.score);

                for (const opt of options) {
                    if (opt.type === 'bin') {
                        const bin = bins[opt.idx];
                        bin.items.push(itemLen);
                        bin.residual -= (itemLen + kerf);
                        dfs(idx + 1, bins, stocks);
                        bin.residual += (itemLen + kerf);
                        bin.items.pop();
                    } else {
                        const st = stocks[opt.idx];
                        st.inv -= 1;
                        bins.push({
                            stockLen: st.len,
                            residual: st.len - itemLen,
                            items: [itemLen]
                        });
                        dfs(idx + 1, bins, stocks);
                        bins.pop();
                        st.inv += 1;
                    }
                }
            }

            try {
                dfs(0, [], cloneStocks(stockState));
            } catch (err) {
                if (err && err.message === 'EXACT_TIMEOUT') {
                    showToast('精确算法搜索时间较长，已自动切换为遗传算法结果。', 'warning');
                    return solveWithGA(stocksData, reqs, kerf);
                }
                throw err;
            }

            if (!bestBins) return null;
            const summary = aggregateBinsToSolution(bestBins, kerf);
            return {
                ...summary,
                algorithmName: '精确算法'
            };
        }

        function highlightChart(idx) {
            if (myChart) {
                myChart.dispatchAction({ type: 'highlight', dataIndex: idx });
                let option = myChart.getOption();
                let validSeriesIdx = 0;
                if (option && option.series) {
                    for (let i = 0; i < option.series.length; i++) {
                        if (option.series[i].data[idx] !== '-') {
                            validSeriesIdx = i; break;
                        }
                    }
                }
                myChart.dispatchAction({ type: 'showTip', seriesIndex: validSeriesIdx, dataIndex: idx });

                try {
                    let pixelY = myChart.convertToPixel({ yAxisIndex: 0 }, idx);
                    let scrollContainer = document.getElementById('chartScrollContainer');
                    if (scrollContainer && typeof pixelY === 'number') {
                        let targetScroll = pixelY - (scrollContainer.clientHeight / 2);
                        scrollContainer.scrollTo({ top: targetScroll, behavior: 'smooth' });
                    }
                } catch (e) { }
            }
        }

        function downplayChart(idx) {
            if (myChart) {
                myChart.dispatchAction({ type: 'downplay', dataIndex: idx });
                myChart.dispatchAction({ type: 'hideTip' });
            }
        }

        function runOptimization() {
            if (demands.length === 0 || stocks.length === 0) return showToast("配置信息不完整，请补充数据", "warning");

            let kerfVal = parseInt(document.getElementById('kerf').value);
            if (isNaN(kerfVal) || kerfVal < 0) kerfVal = 0;

            const algo = selectedAlgorithm;
            const totalDemandCount = demands.reduce((sum, d) => sum + d.dem, 0);

            if (algo === 'exact' && totalDemandCount > 60) {
                showToast('当前数据量较大，精确算法可能耗时较长，请优先使用遗传算法。', 'warning');
            }

            const workingStocks = cloneStocks(stocks);
            let solution = null;

            if (algo === 'exact') {
                solution = solveWithExact(workingStocks, demands, kerfVal);
            } else {
                solution = solveWithGA(workingStocks, demands, kerfVal);
            }

            if (!solution) return showToast("库存不足或无法满足长料需求，排产失败", "error");

            currentSolution = solution;

            document.getElementById('emptyState').style.display = 'none';
            const panel = document.getElementById('resultPanel');
            panel.classList.remove('hidden');
            requestAnimationFrame(() => {
                panel.style.transition = 'opacity 0.6s ease';
                panel.style.opacity = '1';
            });

            document.getElementById('resUsed').innerText = currentSolution.totalBins;
            document.getElementById('resWaste').innerText = currentSolution.totalWaste;
            document.getElementById('resRate').innerText = currentSolution.utilization.toFixed(2);

            let listHtml = '';
            currentSolution.patterns.forEach((p, idx) => {
                let utilRate = ((p.usedLen / p.stockLen) * 100).toFixed(1);
                let barColor = utilRate > 95 ? 'bg-[#34C759]' : (utilRate > 85 ? 'bg-[#007AFF]' : 'bg-[#FF9500]');

                let tagsHtml = p.items.map(item =>
                    `<span class="inline-block bg-[#F2F2F7] text-[#1D1D1F] px-2.5 py-1 rounded-[6px] text-[13px] font-medium border border-[rgba(0,0,0,0.03)] mr-1.5 mb-1.5">
                        ${item.len} <span class="text-[#86868B] mx-0.5">×</span> ${item.count}
                    </span>`
                ).join('');

                listHtml += `
                    <div id="list-card-${idx}" class="relative bg-white p-5 rounded-[20px] border border-transparent shadow-[0_2px_8px_rgba(0,0,0,0.03)] hover:shadow-[0_8px_24px_rgba(0,0,0,0.08)] transition-all duration-300 cursor-pointer"
                         onmouseenter="highlightChart(${idx})" onmouseleave="downplayChart(${idx})">

                        <div class="flex justify-between items-start mb-4">
                            <div class="flex items-center gap-2.5">
                                <span class="bg-[#1D1D1F] text-white text-[12px] font-bold px-2 py-1 rounded-md uppercase tracking-wide">P${idx + 1}</span>
                                <span class="text-[#007AFF] text-[14px] font-semibold bg-[#E5F1FF] px-2.5 py-1 rounded-md">${p.stockLen} mm</span>
                            </div>
                            <div class="text-right">
                                <div class="text-[22px] font-bold text-[#1D1D1F] leading-none">${p.freq} <span class="text-[13px] text-[#86868B] font-normal">次</span></div>
                            </div>
                        </div>

                        <div class="mb-4">
                            ${tagsHtml}
                        </div>

                        <div class="flex items-center gap-3">
                            <div class="flex-grow bg-[#F2F2F7] h-2 rounded-full overflow-hidden">
                                <div class="${barColor} h-full rounded-full transition-all duration-1000" style="width: ${utilRate}%"></div>
                            </div>
                            <span class="text-[13px] font-semibold text-[#86868B] min-w-[40px] text-right">${utilRate}%</span>
                        </div>
                    </div>
                `;
            });

            document.getElementById('aiAnalysis').innerHTML = listHtml;
            setTimeout(() => { renderDynamicChart(); }, 100);
            showToast(`${getAlgoLabel()} 计算完成`, 'info');
        }

            let uniqueLens = [...new Set(pats.flatMap(p => p.items.map(i => i.len)))].sort((a, b) => b - a);

                                <div class="font-semibold text-[14px] bg-[#F2F2F7] px-3 py-1.5 rounded-lg inline-block">执行频次: <span class="text-[#007AFF] ml-1">${pat.freq} 次</span></div>
                            </div>
                        `;

            myChart.setOption(option, true);

            const legendOption = {

            legendChart.resize();

            legendChart.on('legendselectchanged', function (params) {
                myChart.dispatchAction({ type: 'legendToggleSelect', name: params.name });
            });
            legendChart.on('highlight', function (params) {
                myChart.dispatchAction({ type: 'highlight', seriesName: params.seriesName });
            });
            legendChart.on('downplay', function (params) {
                myChart.dispatchAction({ type: 'downplay', seriesName: params.seriesName });
            });

            myChart.on('mouseover', function (params) {
                let targetCard = document.getElementById(`list-card-${params.dataIndex}`);
                if (targetCard) {
                    targetCard.classList.add('list-card-active');
                    targetCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            });
            myChart.on('mouseout', function (params) {
                let targetCard = document.getElementById(`list-card-${params.dataIndex}`);
                if (targetCard) {
                    targetCard.classList.remove('list-card-active');
                }
            });

            window.addEventListener('resize', () => {
                if (myChart) myChart.resize();
                if (legendChart) legendChart.resize();
            });
        }
    </script>

</body>
</html>
